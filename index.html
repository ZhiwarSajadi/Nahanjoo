<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nahanjoo</title>
    <script type="importmap">
    {
      "imports": {
        "react/": "https://esm.sh/react@^19.2.0/",
        "react": "https://esm.sh/react@^19.2.0",
        "react-dom/": "https://esm.sh/react-dom@^19.2.0/",
        "@google/genai": "https://esm.sh/@google/genai@^1.29.0",
        "lucide-react": "https://esm.sh/lucide-react@0.475.0"
      }
    }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            },
            colors: {
              'gem-onyx': 'var(--gem-onyx)',
              'gem-slate': 'var(--gem-slate)',
              'gem-mist': 'var(--gem-mist)',
              'gem-offwhite': 'var(--gem-offwhite)',
              'gem-teal': 'var(--gem-teal)',
              'gem-blue': 'var(--gem-blue)',
            },
            keyframes: {
              'progress-stripes': {
                'from': { backgroundPosition: '1rem 0' },
                'to': { backgroundPosition: '0 0' },
              },
              'blink': {
                '0%, 100%': { opacity: '1' },
                '50%': { opacity: '0' },
              }
            },
            animation: {
              'progress-stripes': 'progress-stripes 1s linear infinite',
              'blink': 'blink 1s step-end infinite',
            },
          }
        }
      }
    </script>
  
  <link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-gem-onyx">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
